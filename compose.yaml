services:
  web:
    image: ib-portal-php:8.2
    ports:
      - '127.0.0.1:8082:80'
    volumes:
      - cms:/var/www/html
      - source:/project
      - private:/var/lib/ib-portal
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: ib_portal
      MARIADB_USER: ib_portal
      MARIADB_PASSWORD: ib-portal-local-db
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cms:
    name: ib-portal-cms
  source:
    name: ib-portal-source
  db:
    name: ib-portal-db
  private:
    name: ib-portal-private
